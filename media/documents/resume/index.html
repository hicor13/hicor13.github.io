<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mario Cornejo Resume</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body { background: #202124; font-family: system-ui, sans-serif; overflow: hidden; }
		.viewer { height: 100%; display: flex; flex-direction: column; }
		header {
			min-height: 56px; padding: 0 16px; display: flex; align-items: center;
			justify-content: space-between; gap: 16px; background: #292a2d;
			border-bottom: 1px solid #414247;
		}
		h1 { margin: 0; font-size: 16px; font-weight: 600; }
		.actions { display: flex; gap: 8px; }
		a {
			color: #fff; text-decoration: none; border: 1px solid #686a70;
			border-radius: 4px; padding: 7px 12px; font-size: 14px;
		}
		a:hover, a:focus { background: #3d3f44; }
		main { flex: 1; min-height: 0; }
		iframe { display: block; width: 100%; height: 100%; border: 0; }
		.fallback { display: none; padding: 32px; text-align: center; color: #ddd; }
		@media (max-width: 480px) {
			header { padding: 0 10px; }
			h1 { font-size: 14px; }
			a { padding: 6px 8px; font-size: 13px; }
		}
	</style>
</head>
<body>
	<div class="viewer">
		<main>
			<iframe src="/media/documents/resume.pdf" title="Resume PDF viewer">
				<div class="fallback">
					Your browser cannot display PDFs. <a href="/media/documents/resume.pdf">Open the PDF</a>.
				</div>
			</iframe>
		</main>
	</div>
</body>
</html>
