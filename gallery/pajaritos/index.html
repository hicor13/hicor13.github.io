<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Cornejo - Bird Photography</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>MARIO CORNEJO</h1>
        <p class="subtitle">Pajarito Album</p>
    </header>

    <div class="gallery" id="gallery">
        <!-- Gallery items will be generated here -->
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <button class="lightbox-nav lightbox-prev" onclick="prevImage()">‹</button>
        <div class="lightbox-content">
            <img id="lightbox-img" src="" alt="">
        </div>
        <button class="lightbox-nav lightbox-next" onclick="nextImage()">›</button>
    </div>

    <script src="images-data.js"></script>
    <script src="script.js"></script>
</body>
</html>
