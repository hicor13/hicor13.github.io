<!DOCTYPE html>
<html lang="es-PE" data-lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Garabatos — Mario Cornejo</title>
  <meta name="description" content="Raspa y dibuja: deja un garabato en la galería pública de mariocornejo.com.">

  <meta property="og:title" content="Garabatos — Mario Cornejo">
  <meta property="og:description" content="Raspa y dibuja: deja un garabato en la galería pública de mariocornejo.com.">
  <meta property="og:image" content="https://mariocornejo.com/garabatos/og-image.png">
  <meta property="og:url" content="https://mariocornejo.com/garabatos/index.html">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <!-- pv1: unlinked from the main site's /styles.css design tokens on
       purpose — this page is going its own visual direction (90s/retro),
       same precedent as gallery/pajaritos staying token-free. All colors
       in garabatos/styles.css below now fall back to their own hardcoded
       defaults instead of the main site's light/dark theme. -->
  <!-- Comic Sans MS is a system font — not installed on Linux/Android/
       most non-Apple, non-Windows devices, silently falling back to a
       generic sans-serif there. Comic Relief is a Google Fonts face
       built as an open, freely-licensed substitute, self-hosted here
       instead of depending on whichever OS the visitor has. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&display=swap">
  <link rel="stylesheet" href="/garabatos/styles.css?v=20260909n">
  <script src="/libs/personal/site-chrome.js?v=20260909h"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
</head>
<body>
  <!-- pv1 retro scaffold: WordArt-style glow badge, sitting between
       <site-topbar> and the intro text. position:sticky's "stuck" range
       is bounded by its own parent's box — since #retro-wordart lives
       inside this (short) header, plain CSS sticky starts pushing it
       back out of the stuck position as soon as the header runs low on
       remaining room below it (well before the header itself fully
       scrolls away). script.js's initWordartPin() computes that exact
       scrollY threshold from real layout measurements and switches the
       badge to position:fixed at the same visual spot right as it's
       reached, so it keeps behaving like a persistent sticky header
       instead of sliding off-screen partway down the page. -->
  <header class="garabatos-header">
    <site-topbar></site-topbar>
    <a class="retro-wordart" id="retro-wordart" href="https://mariocornejo.com/sorpresa">
      <span data-i18n-es>GARABATOS</span><span data-i18n-en>DOODLES</span>
    </a>

    <p class="garabatos-intro">
      <span data-i18n-es>Raspa la superficie negra para revelar el color de abajo. Dibuja algo y déjalo en la galería.</span>
      <span data-i18n-en>Scratch the black surface to reveal the color underneath. Draw something and leave it in the gallery.</span>
    </p>
  </header>

  <main>
    <section class="garabatos-board" aria-label="Tablero de raspado">
      <canvas id="scratch-canvas" width="640" height="400"></canvas>
      <div class="garabatos-controls">
        <label for="brush-size">
          <span data-i18n-es>Grosor</span><span data-i18n-en>Brush size</span>
        </label>
        <input type="range" id="brush-size" min="4" max="40" value="16">
        <button type="button" id="clear-btn">
          <span data-i18n-es>Borrar</span><span data-i18n-en>Clear</span>
        </button>
        <input type="text" id="artist-name" maxlength="40" placeholder="Tu nombre">
        <button type="button" id="save-btn" class="garabatos-save">
          <span data-i18n-es>Guardar</span><span data-i18n-en>Save</span>
        </button>
      </div>
      <p id="save-status" class="garabatos-status" role="status" aria-live="polite"></p>
    </section>

    <section class="garabatos-gallery" aria-label="Galería">
      <h2><span data-i18n-es>Galería</span><span data-i18n-en>Gallery</span></h2>
      <div id="gallery-grid" class="garabatos-grid"></div>
    </section>
  </main>

  <site-footer base="/index.html"></site-footer>

  <script src="/garabatos/canvas.js?v=20260909b"></script>
  <script src="/garabatos/gallery.js?v=20260909a"></script>
  <script src="/garabatos/script.js?v=20260909h"></script>
</body>
</html>
